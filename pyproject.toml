[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "regulatory-intelligence"
version = "0.1.0"
description = "A governed retrieval service for financial regulation: version-aware, permission-aware, eval-gated"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27",
  "lxml>=5.2",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.5"]
llm = ["anthropic>=0.40"]

[tool.hatch.build.targets.wheel]
packages = ["ingest", "retrieval", "evals", "api", "mcp_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
