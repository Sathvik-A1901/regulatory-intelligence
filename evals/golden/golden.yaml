- id: regb-1071-after
  question: Which financial institutions must collect and report small business lending data under Regulation B?
  as_of: 2024-06-01
  role: public
  expected_citations: ["1002.105(b)"]
  answer_points: ["covered financial institution defined by an origination threshold over the two preceding calendar years"]
  should_abstain: false
  status: draft

